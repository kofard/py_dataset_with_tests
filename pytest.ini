[pytest]
relpaths = dataset/

python_files = tests.py
python_functions = test_*

addopts = 
    --import-mode=importlib
    -n auto
    --timeout=5
    --timeout-method=thread
    --tb=no
    -W ignore
    --no-header
    -q
    --json-report
    --json-report-file='report.json'

timeout_func_only = true